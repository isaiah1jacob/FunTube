{% extends 'base.html' %}
{% block title %}Edit Video - FunTube{% endblock %}
{% block content %}
    <div class="page-header">
        <h2>Edit Video</h2>
    </div>
    <form method="post" enctype="multipart/form-data" class="yt-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #ff4444; font-size: 0.85rem; margin-top: 4px;">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{% url 'video_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
